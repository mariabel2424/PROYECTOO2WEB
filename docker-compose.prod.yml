version: '3.8'

services:
  # Backend Laravel (Producción)
  backend:
    build:
      context: ./Proyectito-webxd-main
      dockerfile: Dockerfile
    container_name: busqueday-backend-prod
    restart: always
    working_dir: /var/www/html
    environment:
      - APP_NAME=BusquedayAPI
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://api.tudominio.com
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=busqueday
      - DB_USERNAME=busqueday_user
      - DB_PASSWORD=${DB_PASSWORD}
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - backend-storage:/var/www/html/storage
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - busqueday-network

  # Frontend Next.js (Producción)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: busqueday-frontend-prod
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.tudominio.com/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - busqueday-network

  # Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: busqueday-db-prod
    restart: always
    environment:
      MYSQL_DATABASE: busqueday
      MYSQL_USER: busqueday_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - busqueday-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: busqueday-redis-prod
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - busqueday-network

  # Nginx Reverse Proxy (opcional)
  nginx:
    image: nginx:alpine
    container_name: busqueday-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - busqueday-network

volumes:
  db-data:
  redis-data:
  backend-storage:

networks:
  busqueday-network:
    driver: bridge
